<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Follow View background</title>
</head>
<body>
<script type="module">
import OBR from "https://esm.sh/@owlbear-rodeo/sdk@2";

const META_KEY = "com.maxnanni.follow-view/state";
let followedItemId = null;
let lastCenter = null;
let ticking = false;

async function getAssignments() {
  try {
    const meta = await OBR.room.getMetadata();
    const state = meta[META_KEY];
    if (!state || typeof state !== "object") return {};
    return state.assignments && typeof state.assignments === "object"
      ? state.assignments
      : {};
  } catch {
    return {};
  }
}

async function resolveMyFollow() {
  const assignments = await getAssignments();
  const myId = OBR.player.id;
  followedItemId = assignments[myId] || null;
  lastCenter = null;
  if (followedItemId) {
    await centerOnItem(followedItemId, true);
  }
}

/**
 * Centra el viewport en el centro real del token (bounding box),
 * no en item.position (que en imágenes suele ser la esquina/offset).
 * Usa inverseTransformPoint para no asumir si position es top-left o centro.
 */
async function centerOnItem(itemId, force) {
  if (!itemId) return;
  try {
    const bounds = await OBR.scene.items.getItemBounds([itemId]);
    if (!bounds || !bounds.center) return;

    const target = bounds.center;
    if (
      !force &&
      lastCenter &&
      Math.abs(lastCenter.x - target.x) < 0.5 &&
      Math.abs(lastCenter.y - target.y) < 0.5
    ) {
      return;
    }
    lastCenter = { x: target.x, y: target.y };

    const width = await OBR.viewport.getWidth();
    const height = await OBR.viewport.getHeight();
    const screenCenter = { x: width / 2, y: height / 2 };

    // Punto del mundo que hoy está en el centro de la pantalla
    const worldAtScreenCenter = await OBR.viewport.inverseTransformPoint(screenCenter);

    // Cuánto hay que desplazar el viewport para que el token quede centrado
    const dx = target.x - worldAtScreenCenter.x;
    const dy = target.y - worldAtScreenCenter.y;

    if (Math.abs(dx) < 0.25 && Math.abs(dy) < 0.25 && !force) return;

    const pos = await OBR.viewport.getPosition();
    await OBR.viewport.setPosition({
      x: pos.x + dx,
      y: pos.y + dy,
    });
  } catch (e) {
    console.error("[Follow View] centerOnItem", e);
  }
}

function scheduleCenter(itemId) {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(async () => {
    ticking = false;
    await centerOnItem(itemId, false);
  });
}

OBR.onReady(async () => {
  await resolveMyFollow();

  OBR.room.onMetadataChange(() => {
    resolveMyFollow();
  });

  OBR.scene.items.onChange((items) => {
    if (!followedItemId) return;
    // onChange entrega todos los items; filtramos por el seguido
    const followed = items.find((item) => item.id === followedItemId);
    if (followed) scheduleCenter(followedItemId);
  });
});
</script>
</body>
</html>
